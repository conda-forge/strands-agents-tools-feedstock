{% set name = "strands-agents-tools" %}
{% set version = "0.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/strands_agents_tools-{{ version }}.tar.gz
  sha256: 101e7144eedead1e5b649aa291d6b55c4d7d761e42cda304e765cfcd9fee00bd

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - strands-agents >=1.0.0
    - aiohttp >=3.8.0,<4.0.0
    - aws-requests-auth >=0.4.3,<0.5.0
    - botocore >=1.39.7,<2.0.0
    - dill >=0.4.0,<0.5.0
    - markdownify >=1.0.0,<2.0.0
    - pillow >=12.1.1,<14.0.0
    - prompt-toolkit >=3.0.51,<4.0.0
    - pyjwt >=2.10.1,<3.0.0
    - python-tzdata
    - requests >=2.28.0,<3.0.0
    - rich >=14.0.0,<16.0.0
    - slack-bolt >=1.23.0,<2.0.0
    - sympy >=1.12.0,<2.0.0
    - tenacity >=9.1.2,<10.0.0
    - typing_extensions >=4.5.0,<5.0.0
    - watchdog >=6.0.0,<7.0.0

test:
  imports:
    - strands_tools
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}


about:
  home: https://github.com/strands-agents/tools
  summary: A collection of specialized tools for Strands Agents
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  doc_url: https://strandsagents.com/docs/user-guide/migrate/strands-agents-tools/
  dev_url: https://github.com/strands-agents/tools

extra:
  recipe-maintainers:
    - yonib05
    - Unshure
    - athkulk
    - giswqs
